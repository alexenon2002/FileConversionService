services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: FileConversionService
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d FileConversionService" ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: local-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./infra/minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio_data:/data
  kafka:
    image: apache/kafka:4.2.2
    ports:
      - "127.0.0.1:9092:9092"


volumes:
  postgres_data:
  minio_data: